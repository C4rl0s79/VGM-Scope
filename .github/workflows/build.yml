name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure backend
        run: |
          cmake -S backend -B backend\build -G "Visual Studio 17 2022" -A x64

      - name: Build backend
        run: |
          cmake --build backend\build --config Release

      - name: Build executable
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name VGM-Scope --add-binary "backend\build\Release\vgm_engine.dll;." app/main.py

      - name: Create ZIP
        run: |
          Compress-Archive -Path dist/VGM-Scope.exe -DestinationPath VGM-Scope-windows-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VGM-Scope-windows-x64
          path: VGM-Scope-windows-x64.zip

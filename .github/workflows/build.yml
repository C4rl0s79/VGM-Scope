name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install x64 dependencies
        run: |
          vcpkg install zlib:x64-windows libiconv:x64-windows

      - name: Configure backend
        run: |
          cmake -S backend -B backend\build `
            -DCMAKE_TOOLCHAIN_FILE=C:\vcpkg\scripts\buildsystems\vcpkg.cmake `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DZLIB_ROOT=C:\vcpkg\installed\x64-windows `
            -DIconv_INCLUDE_DIR=C:\vcpkg\installed\x64-windows\include `
            -DIconv_LIBRARY=C:\vcpkg\installed\x64-windows\lib\libiconv.lib `
            -DBUILD_PLAYER=OFF `
            -DBUILD_VGM2WAV=OFF `
            -DBUILD_TESTS=OFF `
            -DUSE_SANITIZERS=OFF

      - name: Build backend
        run: |
          cmake --build backend\build --config Release

      - name: Build executable
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name VGM-Scope --add-binary "backend\build\Release\vgm_engine.dll;." app/main.py

      - name: Copy runtime DLLs
        run: |
          if (Test-Path "C:\vcpkg\installed\x64-windows\bin") {
            Copy-Item -Path "C:\vcpkg\installed\x64-windows\bin\*.dll" -Destination "dist" -Force
          }

      - name: Create ZIP
        run: |
          Compress-Archive -Path dist/* -DestinationPath VGM-Scope-windows-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VGM-Scope-windows-x64
          path: VGM-Scope-windows-x64.zip
